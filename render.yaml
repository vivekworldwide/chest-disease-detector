# ============================================================================
# Render Blueprint Specification (https://render.com/docs/blueprint-spec)
# ============================================================================
services:
  - type: web
    name: chestvision-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
