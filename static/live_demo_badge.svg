<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 44" width="230" height="44">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#111c35"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Button Background -->
  <rect x="1" y="1" width="228" height="42" rx="10" fill="url(#bgGradient)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Logo Icon Container -->
  <rect x="7" y="7" width="30" height="30" rx="7" fill="url(#cyanGrad)"/>
  
  <!-- Medical Pulse / ECG Wave (ChestVision AI Logo) -->
  <path d="M12 22h4l2.5-6.5 3 13 2.5-6.5h4" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Brand Title -->
  <text x="46" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.2">ChestVision AI</text>

  <!-- Subtitle / Action -->
  <text x="46" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8" letter-spacing="0.3">LAUNCH LIVE APP</text>

  <!-- External Arrow -->
  <g transform="translate(202, 14)">
    <path d="M2 12L12 2M12 2H5M12 2V9" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Live Pulse Dot -->
  <circle cx="192" cy="22" r="3.5" fill="#10b981"/>
</svg>
